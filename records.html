window.NDA_SECTIONS = [
{h:"Recitals", b:[
"THIS CONFIDENTIALITY AND NON-DISCLOSURE AGREEMENT (this \"Agreement\") is made as of the date on which it is last executed by the parties (the \"Effective Date\") between: BRAINS BIOCEUTICAL CORP., a corporation existing under the laws of British Columbia, Canada (the \"Company\"); and the person identified as the Recipient on the execution page of this Agreement (the \"Recipient\").",
"A. The Company is evaluating and negotiating a potential business combination with a special purpose acquisition company whose securities are listed on The Nasdaq Stock Market, together with a related private placement of securities and a listing of the securities of a resulting issuer on a United States national securities exchange (the \"Potential Transaction\").",
"B. The Recipient has been identified by the Company as a person who may need to receive information concerning the Potential Transaction. The Company is prepared to disclose such information to the Recipient only on the terms of this Agreement.",
"C. Information to be disclosed concerns a proposed transaction involving an issuer whose securities are publicly traded and constitutes, or may constitute, material non-public information under Canadian and United States securities laws. It also concerns a company whose securities, although not publicly traded, are the subject of transfer, conversion, pre-emptive and consent rights held by third parties.",
"D. The Company is subject to confidentiality obligations owed to third parties in respect of the Potential Transaction, and enters into this Agreement in part to enable it to comply with those obligations.",
"NOW THEREFORE, in consideration of the Company disclosing or agreeing to disclose Confidential Information to the Recipient, and other good and valuable consideration (the receipt and sufficiency of which the Recipient acknowledges), the Recipient covenants and agrees with the Company as follows:"]},
{h:"1. Definitions and interpretation", b:[
"1.1 \"Confidential Information\" means all information, in any form and whether or not marked confidential, that is disclosed or made available, directly or indirectly, by or on behalf of the Company or any of its Representatives to the Recipient or any of its Representatives, whether before, on or after the Effective Date, and whether disclosed orally, in writing, electronically, by demonstration, by access to a data room, or by observation, including: (a) the existence, status, structure, terms, valuation, financing, timing and prospects of the Potential Transaction, and the fact that discussions or negotiations are taking place or have taken place, and the status of those discussions; (b) the identity of the special purpose acquisition company, its sponsor, its directors and officers, its advisers and its financing sources, and the identity of any other counterparty, target, investor or financing source considered in connection with the Potential Transaction; (c) the existence and terms of any letter of intent, term sheet, exclusivity arrangement, subscription agreement, business combination agreement or other document relating to the Potential Transaction; (d) financial statements, forecasts, projections, models, budgets, capitalisation tables, valuation analyses, pro forma ownership figures and minimum cash, financing or investment requirements; (e) business, operational, commercial, scientific, technical, regulatory, tax, personnel and customer or supplier information of the Company and its affiliates, including formulations, processes, know-how, trade secrets, licences and product development plans; (f) information concerning actual, threatened or contemplated litigation, arbitration, disputes, settlements, insolvency events, security enforcement, regulatory matters or investigations involving the Company or any of its affiliates, shareholders or securityholders; (g) the terms of the Company\u2019s constating documents, shareholder agreements, investor rights agreements, convertible instruments, security documents and any consents, waivers or amendments sought or obtained in connection with the Potential Transaction; and (h) all notes, memoranda, analyses, compilations, studies, summaries, models, extracts and other materials prepared by or for the Recipient or its Representatives to the extent that they contain, reflect, are based upon or are derived from any of the foregoing (together, \"Derived Materials\").",
"1.2 Confidential Information does not include information that the Recipient establishes by contemporaneous written records: (a) is or becomes generally available to the public other than as a result of a breach of this Agreement or of any other duty of confidence owed to the Company by any person; (b) was lawfully in the Recipient\u2019s possession on a non-confidential basis before it was disclosed under this Agreement; (c) becomes available to the Recipient on a non-confidential basis from a source that is not, to the Recipient\u2019s knowledge after reasonable inquiry, under any obligation of confidence to the Company; or (d) is independently developed by the Recipient without use of, reference to, or reliance on any Confidential Information. The exceptions in this Section 1.2 do not apply to the existence, status or terms of the Potential Transaction merely because some component of it is publicly known, and specific information is not brought within an exception merely because it is embraced by more general information that is.",
"1.3 \"Representatives\" means, in respect of any person, its affiliates and its and their directors, officers, employees, partners, members, trustees, agents, legal counsel, accountants, financial advisers, consultants and, where applicable, its lenders and prospective sources of financing, in each case to the extent engaged or acting in connection with the Purpose.",
"1.4 \"Purpose\" means the following: (a) evaluating, considering and responding to the Potential Transaction; (b) providing services, advice, consents, waivers, approvals or information reasonably required by the Company in connection with the Potential Transaction; (c) performing the Recipient\u2019s duties to the Company where the Recipient is a director, officer, employee or contractor of the Company; and (d) where the Recipient is a prospective investor, evaluating whether to invest in securities issued in connection with the Potential Transaction. The Purpose does not include, and the Recipient shall not use Confidential Information for, any other purpose whatsoever, including any competitive, commercial, investment, trading, tax, litigation or negotiating purpose that is not expressly the Purpose.",
"1.5 \"Restricted Period\" means the period commencing on the Effective Date and ending on the later of (a) the date that is forty-five (45) days after the Effective Date, and (b) the date on which the Confidential Information ceases to constitute material non-public information in respect of the Company Securities under applicable Canadian and United States securities laws; provided that nothing in this Agreement limits any longer period of restriction imposed by applicable law, and that if any part of the Restricted Period is held to exceed what applicable law permits, it is to be read down to the maximum permitted period and in no event to less than forty-five (45) days. \"Standstill Period\" means a period of the same duration as the Restricted Period, determined on the same basis. \"Company Securities\" means any securities of the Company, of the special purpose acquisition company, or of any resulting issuer or successor in the Potential Transaction, and any derivative of, or economic interest referable to, any of them. \"Restricted Persons\" has the meaning given in Section 7.1.",
"1.6 In this Agreement, \"person\" includes an individual, corporation, partnership, trust and unincorporated organisation; \"including\" means including without limitation; the singular includes the plural; and headings are for convenience only and do not affect interpretation. Where the Recipient is an individual, references to the Recipient\u2019s Representatives are to be read as references to the professional advisers of the Recipient permitted under Section 3."]},
{h:"2. Confidentiality and permitted use", b:[
"2.1 The Recipient shall: (a) hold all Confidential Information in strict confidence; (b) protect it using at least the degree of care that the Recipient uses to protect its own most sensitive confidential information, and in any event no less than a reasonable degree of care; (c) use it solely for the Purpose; and (d) not disclose it to any person except as expressly permitted by Section 3 or Section 4.",
"2.2 The Recipient shall not, and shall procure that its Representatives do not, make any public announcement, press release, social media post, investor communication, marketing statement or other public or semi-public communication concerning the Potential Transaction, the Company, this Agreement or the existence or content of any discussions with the Company, without the prior written consent of the Company. The Recipient acknowledges that communications concerning a proposed business combination with a publicly listed acquisition vehicle may themselves be regulated communications under United States securities laws.",
"2.3 The Recipient shall not create Derived Materials except to the extent reasonably necessary for the Purpose, shall keep Derived Materials subject to this Agreement in all respects, and shall not input, upload or otherwise submit any Confidential Information into any artificial intelligence, machine learning, translation or other third-party hosted service that does not contractually prohibit use of the input for training or other purposes.",
"2.4 The Recipient shall promptly notify the Company in writing upon becoming aware of any unauthorised use, disclosure, loss or compromise of Confidential Information, and shall cooperate fully with the Company at the Recipient\u2019s cost to limit the consequences of that event."]},
{h:"3. Representatives", b:[
"3.1 The Recipient may disclose Confidential Information only to those of its Representatives who: (a) need to know it for the Purpose; (b) have been informed of the confidential nature of the Confidential Information and of the terms of this Agreement, including the securities law restrictions in Section 5; and (c) are bound by professional duties of confidence or by written obligations no less protective than this Agreement.",
"3.2 The Company may at any time, by written notice to the Recipient, limit the persons to whom the Recipient may disclose Confidential Information to individuals named in that notice. Following such a notice, the Recipient shall not disclose Confidential Information to any other person, including any other employee, officer, director or affiliate of the Recipient, without the prior written consent of the Company. The Company may require the Recipient to maintain, and to provide on request, a written record of each person to whom Confidential Information has been disclosed and the date of disclosure.",
"3.3 The Recipient is liable to the Company for any act or omission of any of its Representatives, and of any person to whom it discloses Confidential Information, that would constitute a breach of this Agreement if that act or omission were that of the Recipient. This liability applies whether or not the Representative is itself party to any agreement with the Company, and is not affected by the Recipient having complied with Section 3.1.",
"3.4 Where the Recipient is a director or officer of the Company, nothing in this Agreement limits or qualifies the Recipient\u2019s statutory and fiduciary duties to the Company, or the Company\u2019s right to enforce them; this Agreement is in addition to those duties."]},
{h:"4. Compelled disclosure", b:[
"4.1 If the Recipient or any of its Representatives is required by applicable law, regulation, stock exchange rule, or by judicial, arbitral, regulatory or administrative process, to disclose any Confidential Information, the Recipient shall, to the extent lawfully permitted and practicable: (a) give the Company prompt written notice before any disclosure is made, so that the Company may seek a protective order, sealing order or other remedy or waive compliance with this Agreement; (b) cooperate with the Company, at the Company\u2019s cost, in any such application; (c) disclose only that portion of the Confidential Information that the Recipient is advised by counsel it is legally required to disclose; and (d) use reasonable efforts to obtain assurances that confidential treatment will be accorded to the disclosed information.",
"4.2 For certainty, a disclosure compelled under this Section does not release the Recipient from its obligations in respect of any other Confidential Information, and does not permit the Recipient to use the disclosed information for any purpose other than the compelled disclosure."]},
{h:"5. Securities law acknowledgement; no trading; no tipping", b:[
"5.1 Acknowledgement. The Recipient acknowledges and agrees that Confidential Information includes, or is likely to include, material non-public information (also described as material information that has not been generally disclosed) concerning: (a) a special purpose acquisition company whose securities are listed on The Nasdaq Stock Market and are held by public investors; (b) the Company; and (c) any resulting issuer or successor arising from the Potential Transaction. The Recipient acknowledges that applicable Canadian and United States securities laws prohibit persons in possession of such information from trading in the relevant securities and from communicating that information to others in specified circumstances, and that contravention may attract civil and criminal liability.",
"5.2 No trading. The Recipient shall not, and shall direct its Representatives not to, while in possession of Confidential Information constituting material non-public information and until that information has been generally disclosed or has ceased to be material: (a) purchase, sell, short sell, pledge, hedge or otherwise transact in any Company Securities, directly or indirectly, whether for the Recipient\u2019s own account or the account of any other person; (b) enter into, exercise or unwind any option, swap, forward, contract for difference or other derivative referable to any Company Securities; or (c) exercise, convert, subscribe for or transfer any right to acquire Company Securities, except with the prior written consent of the Company or as expressly required or permitted by an instrument to which the Company is party and in compliance with applicable securities laws.",
"5.3 No tipping. The Recipient shall not inform, recommend or encourage any other person to purchase, sell or otherwise transact in any Company Securities, and shall not disclose Confidential Information to any person other than as permitted by this Agreement, including in circumstances in which it is reasonably foreseeable that the person may trade in, or advise another to trade in, any Company Securities.",
"5.4 Existing holders. If the Recipient holds, or at any time acquires, any securities of the Company, the Recipient further acknowledges that the restrictions in Sections 5.2 and 5.3 apply to any sale, transfer, assignment, pledge or other disposition of those securities, and to any solicitation of an offer to acquire them, while the Recipient is in possession of material non-public information, and that a purported disposition made in contravention of applicable securities laws may be voidable and may give rise to liability to the counterparty and to the Company.",
"5.5 No advice; no offer. Nothing disclosed under this Agreement constitutes investment, legal, accounting or tax advice, or an offer to sell or a solicitation of an offer to buy any security. Any offer of securities in connection with the Potential Transaction will be made, if at all, only pursuant to definitive documentation and in compliance with applicable securities laws, including applicable prospectus and registration requirements or exemptions from them. The Recipient shall not act as a finder, broker, dealer or placement agent for the Company or in respect of the Potential Transaction, and shall not solicit or approach any person to invest in the Potential Transaction, without the Company\u2019s prior written consent."]},
{h:"6. Standstill", b:[
"6.1 During the Standstill Period, the Recipient shall not, and shall procure that its affiliates and its and their Representatives acting on its behalf do not, directly or indirectly, without the prior written invitation or consent of the board of directors of the Company: (a) acquire, offer to acquire or agree to acquire any Company Securities or any material assets of the Company or its affiliates; (b) make, participate in or encourage any solicitation of proxies or written consents, or seek to influence or control the management, board or policies of the Company; (c) propose, announce or make any tender offer, exchange offer, business combination, recapitalisation, restructuring, plan of arrangement or similar transaction involving the Company or the Potential Transaction; (d) form, join or participate in any group, joint venture, voting trust, pooling arrangement or other agreement or understanding with any other person in respect of any Company Securities; (e) requisition or seek to requisition any meeting of shareholders, or seek the removal or appointment of any director; or (f) enter into any discussions, negotiations or arrangements with any third party, or advise, assist or encourage any third party, in respect of any of the foregoing.",
"6.2 The Recipient shall not make any public announcement or any request (public or private) that the Company amend, waive or release any provision of this Section 6, and shall not take any action that would reasonably be expected to require the Company or any other person to make a public announcement in respect of any of the matters in Section 6.1.",
"6.3 Section 6.1 does not restrict: (a) the exercise of rights that the Recipient holds under an instrument entered into with the Company before the Effective Date and disclosed to the Company, exercised in accordance with its terms and with applicable securities laws; (b) participation in the Potential Transaction itself on terms offered by the Company; or (c) the exercise by a director or officer of the Company of that person\u2019s duties to the Company."]},
{h:"7. Non-solicitation and no contact", b:[
"7.1 Restricted Persons. \"Restricted Persons\" means: (a) the special purpose acquisition company party to the Potential Transaction, its sponsor and their respective directors, officers, employees, members, advisers, counsel, underwriters, placement agents and financing sources; (b) the Company\u2019s legal, financial, accounting, tax and other professional advisers engaged in connection with the Potential Transaction; (c) any shareholder, noteholder, securityholder or other stakeholder of the Company whose consent, waiver or participation is or may be required in connection with the Potential Transaction; and (d) any customer, supplier, licensor, licensee, distributor, lender or regulator of the Company that the Recipient becomes aware of through Confidential Information.",
"7.2 No contact. During the Restricted Period the Recipient shall not, and shall procure that its Representatives do not, initiate or engage in any communication with any Restricted Person concerning the Company, the Potential Transaction or any Confidential Information, except through a person designated in writing by the Company for that purpose. All questions, requests for information and requests for access are to be directed solely to the Company\u2019s designated contact.",
"7.3 Non-solicitation of personnel. During the Restricted Period the Recipient shall not, directly or indirectly, solicit for employment or engagement, or employ or engage, any director, officer, employee or contractor of the Company or any of its affiliates with whom the Recipient had contact, or of whom the Recipient became aware, in connection with the Purpose. This Section does not prohibit: (a) a general public advertisement or recruitment campaign not specifically targeted at such persons, or the hiring of a person who responds to it without other solicitation; or (b) the hiring of a person whose engagement with the Company ended at least six months before the first contact by the Recipient.",
"7.4 No interference. The Recipient shall not use Confidential Information to solicit, divert or interfere with any customer, supplier, licensor, distributor or contractual counterparty of the Company, or to compete with the Company or the Potential Transaction, including by pursuing or facilitating a competing transaction with any Restricted Person.",
"7.5 The Recipient acknowledges that the restrictions in this Section 7 are reasonable in scope and duration, are necessary to protect the legitimate proprietary interests of the Company in circumstances where a transaction is under exclusive negotiation, and have been considered by the Recipient with the benefit of such advice as the Recipient considered appropriate."]},
{h:"8. No residuals; no licence; no obligation", b:[
"8.1 No residuals. The Recipient acknowledges that this Agreement contains no residuals clause and confers no right of any kind to use Confidential Information retained in the unaided memory of any individual. Any use or disclosure of Confidential Information, whether from a document or from memory, and whether or not intentional, is a use or disclosure for the purposes of this Agreement and is subject to its restrictions in full.",
"8.2 No licence. No licence, assignment or other right, whether by implication, estoppel or otherwise, is granted to the Recipient in or to any Confidential Information, or to any patent, copyright, trade mark, trade secret or other intellectual property of the Company or of any third party. All Confidential Information remains the property of the Company or of the third party from whom it originates.",
"8.3 No obligation; no representation. Nothing in this Agreement obliges the Company to disclose any particular information, to continue discussions with the Recipient, to proceed with the Potential Transaction or any alternative transaction, or to offer any securities to the Recipient. The Company makes no representation or warranty, express or implied, as to the accuracy or completeness of any Confidential Information, and neither the Company nor any of its Representatives has or will have any liability to the Recipient arising from the Recipient\u2019s use of or reliance on it. Only the representations and warranties expressly set out in executed definitive documentation, and subject to the limitations in it, will have legal effect.",
"8.4 Reservation of rights. Nothing in this Agreement constitutes a waiver, amendment, extension or forbearance of any right, remedy, obligation, notice period, consent requirement, conversion right, pre-emptive right or default under any agreement between the Company and the Recipient or any third party, all of which are expressly reserved."]},
{h:"9. Return or destruction", b:[
"9.1 Upon the written request of the Company at any time, and in any event promptly upon the Recipient ceasing to require Confidential Information for the Purpose, the Recipient shall, at the Company\u2019s election: (a) return to the Company all Confidential Information in tangible form, together with all copies; and (b) destroy or permanently delete all other Confidential Information, including all Derived Materials and all copies held in electronic form by the Recipient or any of its Representatives.",
"9.2 Within ten (10) business days of the Company\u2019s request, an authorised signatory of the Recipient (or, where the Recipient is an individual, the Recipient) shall deliver to the Company a certificate in the form of Schedule A confirming compliance with Section 9.1.",
"9.3 The Recipient may retain copies of Confidential Information: (a) held in automatic electronic backup or archival systems that are not readily accessible in the ordinary course of business and that are not accessed for any purpose other than backup recovery; and (b) to the extent required by applicable law, regulation, or the bona fide internal document retention or professional conduct requirements of the Recipient or its professional advisers. All Confidential Information so retained remains subject to this Agreement for so long as it is retained, notwithstanding Section 10."]},
{h:"10. Term and survival", b:[
"10.1 This Agreement applies to all Confidential Information disclosed at any time, whether before, on or after the Effective Date. The obligations in this Agreement survive for so long as the relevant Confidential Information remains confidential, that is, until it ceases to be Confidential Information by falling within an exception in Section 1.2. No fixed expiry date applies to those obligations.",
"10.2 Notwithstanding Section 10.1: (a) the obligations in Section 5 survive until the relevant information has been generally disclosed or has ceased to constitute material non-public information; (b) obligations in respect of information constituting a trade secret survive for so long as the information remains a trade secret; and (c) obligations in respect of information subject to solicitor-client privilege or litigation privilege survive indefinitely.",
"10.3 Termination or expiry of this Agreement does not affect any right or liability accrued before termination, and does not release the Recipient in respect of Confidential Information retained under Section 9.3."]},
{h:"11. Remedies", b:[
"11.1 The Recipient acknowledges that: (a) the Confidential Information is of a special, unique and extraordinary character; (b) a breach or threatened breach of this Agreement would cause the Company immediate and irreparable harm for which damages would be an inadequate remedy; and (c) the Company is accordingly entitled to seek and obtain interim, interlocutory and permanent injunctive relief, specific performance and other equitable relief in respect of any actual or threatened breach, without the necessity of proving actual loss or special damages and without any requirement to post security or provide an undertaking as to damages beyond any undertaking the court requires as a matter of law.",
"11.2 The rights and remedies in this Agreement are cumulative and in addition to, and not in substitution for, any other right or remedy available to the Company at law, in equity or under any other agreement or statute.",
"11.3 The Recipient shall indemnify and hold harmless the Company and its Representatives against all losses, liabilities, damages, costs and expenses (including legal fees and disbursements on a full indemnity basis) arising out of or in connection with any breach of this Agreement by the Recipient or any of its Representatives, or any third party claim arising from such a breach."]},
{h:"12. General", b:[
"12.1 Governing law and jurisdiction. This Agreement is governed by the laws of the Province of British Columbia and the federal laws of Canada applicable in that province. The Recipient irrevocably attorns to the jurisdiction of the courts of British Columbia sitting at Vancouver, which have exclusive jurisdiction over any dispute arising out of or in connection with this Agreement, provided that the Company may seek injunctive or other equitable relief in any court of competent jurisdiction, including in the jurisdiction where the Recipient or its assets are located.",
"12.2 Entire agreement. This Agreement, together with its schedules, constitutes the entire agreement between the parties in respect of the confidentiality of the Confidential Information and supersedes all prior understandings on that subject, provided that it is in addition to, and does not amend, replace or reduce, any confidentiality, non-disclosure, non-competition or fiduciary obligation owed to the Company under any other agreement, instrument, statute or at law, and in the event of conflict the provision more protective of the Company prevails.",
"12.3 Amendment and waiver. No amendment to this Agreement is effective unless in writing and signed by both parties. No waiver of any provision is effective unless in writing and signed by the party granting it, and no failure or delay in exercising any right operates as a waiver of it. A waiver on one occasion does not operate as a waiver on any other occasion.",
"12.4 Assignment and successors. The Recipient may not assign or transfer this Agreement or any right or obligation under it without the prior written consent of the Company. The Company may assign this Agreement, without consent, to any affiliate, successor or resulting issuer in connection with the Potential Transaction, and this Agreement enures to the benefit of the Company and its successors and permitted assigns.",
"12.5 Third party beneficiaries. The Company holds the benefit of Sections 2, 5, 7 and 11 in trust for each of its affiliates and, in respect of information originating from them, for the special purpose acquisition company and its sponsor, each of which may enforce those provisions directly against the Recipient.",
"12.6 Severability. If any provision of this Agreement is held to be invalid, illegal or unenforceable, the remainder continues in full force and effect, and the provision is to be read down or reformed to the minimum extent necessary to make it valid and enforceable while preserving the parties\u2019 intent.",
"12.7 Notices. Notices under this Agreement must be in writing and delivered by hand, courier or email to the address specified by the Recipient on the execution page (in the case of the Recipient) and to the Company at its registered office with a copy to Origin Law Corporation, and are deemed received on delivery, or on the next business day if delivered after 5:00 p.m. local time.",
"12.8 Counterparts; electronic execution. This Agreement may be executed in counterparts and delivered electronically, each of which is an original and all of which together constitute one agreement.",
"12.9 Independent advice. The Recipient acknowledges that it has had the opportunity to obtain independent legal advice in respect of this Agreement, that Origin Law Corporation acts for the Company alone and not for the Recipient, and that the Recipient has entered into this Agreement voluntarily and with full understanding of its terms.",
"12.10 Language. The parties have requested that this Agreement and all related documents be drawn up in the English language. Les parties ont demand\u00e9 que cette convention ainsi que tous les documents qui s\u2019y rattachent soient r\u00e9dig\u00e9s en langue anglaise."]}
];

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  // robust CSV parse (quoted fields, embedded commas/newlines)
  function parseCSV(text){
    var rows=[],row=[],cur='',inQ=false;
    for (var i=0;i<text.length;i++){
      var c=text[i];
      if (inQ){
        if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=c;
      } else {
        if (c==='"') inQ=true;
        else if (c===','){ row.push(cur); cur=''; }
        else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if (row.length>1||row[0]!=='') rows.push(row); row=[]; }
        else cur+=c;
      }
    }
    if (cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function findCol(headers, needles){
    for (var i=0;i<headers.length;i++){ var h=headers[i].toLowerCase();
      for (var j=0;j<needles.length;j++) if (h.indexOf(needles[j])>=0) return i; }
    return -1;
  }
  var subs=[];
  document.getElementById('csv').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var rows=parseCSV(String(r.result));
      if (rows.length<2){ alert('No submissions found in that CSV.'); return; }
      var H=rows[0];
      var col={ name:findCol(H,['name']), entity:findCol(H,['entity']), title:findCol(H,['title']),
        email:findCol(H,['email']), address:findCol(H,['address']), date:findCol(H,['date','created','submitted']),
        type:findCol(H,['recipient']), sig:findCol(H,['signature']) };
      subs=rows.slice(1).filter(function(r){ return r.length>1; }).map(function(r){
        return { name:r[col.name]||'', entity:r[col.entity]||'', title:r[col.title]||'',
          email:r[col.email]||'', address:r[col.address]||'', date:r[col.date]||'',
          type:r[col.type]||'', sig:r[col.sig]||'' };
      });
      renderList();
    };
    r.readAsText(f);
  });
  function renderList(){
    var el=document.getElementById('list');
    if (!subs.length){ el.innerHTML='<p style="color:#9A9A8C;">No submissions in file.</p>'; return; }
    el.innerHTML='<table><tr><th>Name</th><th>Entity</th><th>Email</th><th>Date</th><th></th></tr>'+
      subs.map(function(s,i){ return '<tr class="row" data-i="'+i+'"><td>'+esc(s.name)+'</td><td>'+esc(s.entity)+'</td><td>'+esc(s.email)+'</td><td>'+esc(s.date)+'</td><td style="text-align:right;"><button class="btn dark" data-i="'+i+'" style="padding:8px 16px;font-size:11px;">Executed PDF</button></td></tr>'; }).join('')+'</table>';
    el.querySelectorAll('[data-i]').forEach(function(n){ n.addEventListener('click', function(ev){ ev.stopPropagation(); openDoc(+n.getAttribute('data-i')); }); });
  }
  function openDoc(i){
    var s=subs[i];
    var d=document.getElementById('doc');
    d.innerHTML='<div style="text-align:center;font-size:18px;font-weight:600;margin-bottom:6px;">Confidentiality and Non-Disclosure Agreement</div>'+
      '<div style="text-align:center;font-size:12px;color:#555;margin-bottom:22px;">Brains Bioceutical Corp. — executed electronically</div>'+
      window.NDA_SECTIONS.map(function(sec){ return '<div style="margin-bottom:14px;"><div style="font-weight:600;margin-bottom:5px;">'+esc(sec.h)+'</div>'+sec.b.map(function(p){return '<p style="margin:0 0 7px;">'+esc(p)+'</p>';}).join('')+'</div>'; }).join('')+
      '<div style="margin-top:26px;border-top:1px solid #999;padding-top:16px;break-inside:avoid;">'+
      '<div style="font-weight:600;margin-bottom:10px;">IN WITNESS WHEREOF the parties have executed this Agreement as of the Effective Date.</div>'+
      '<div style="display:flex;gap:60px;"><div style="flex:1;"><div style="font-weight:600;">BRAINS BIOCEUTICAL CORP.</div><div style="margin-top:40px;border-top:1px solid #333;padding-top:4px;">Per: ____________________</div></div>'+
      '<div style="flex:1;"><div style="font-weight:600;">RECIPIENT</div>'+
      (s.sig&&s.sig.indexOf('data:image')===0?'<img src="'+s.sig+'" style="height:60px;margin-top:8px;display:block;">':'')+
      '<div style="border-top:1px solid #333;padding-top:4px;">Signature</div>'+
      '<div style="margin-top:8px;">Recipient type: '+esc(s.type)+'</div><div>Entity: '+esc(s.entity)+'</div><div>Name: '+esc(s.name)+'</div><div>Title: '+esc(s.title)+'</div>'+
      '<div>Address: '+esc(s.address)+'</div><div>Email: '+esc(s.email)+'</div><div>Date: '+esc(s.date)+'</div></div></div></div>';
    window.print();
  }
})();
</script>
