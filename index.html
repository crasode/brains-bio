<style>
  html,body{margin:0;background:#0C3824;font-family:Archivo,system-ui,sans-serif;}
  a{color:#0C3824;text-decoration:none;} a:hover{color:#D95700;}
  input,textarea{font-family:Archivo,system-ui,sans-serif;}
  input:focus{outline:2px solid #D95700;outline-offset:0;}
  .card{background:#F5F5EB;width:100%;margin-top:30px;padding:44px 52px;box-sizing:border-box;}
  .btn{background:#0C3824;color:#F5F5EB;border:none;padding:15px 34px;font:600 14px Archivo,system-ui,sans-serif;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;}
  .btn[disabled]{background:#9A9A8C;cursor:not-allowed;}
  .btn.orange{background:#D95700;}
  .field{width:100%;box-sizing:border-box;border:1px solid #C9CBB4;background:#fff;padding:12px 14px;font-size:15px;color:#0C3824;}
  .flabel{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#42574A;margin-bottom:6px;}
  .kind-btn{flex:1;padding:12px;font:600 13px Archivo;cursor:pointer;border:1px solid #0C3824;background:transparent;color:#0C3824;}
  .kind-btn.on{background:#0C3824;color:#F5F5EB;}
  .check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;cursor:pointer;background:#EBEBDD;padding:16px 18px;font-size:14px;line-height:1.5;color:#0C3824;}
  .check input{width:18px;height:18px;margin-top:1px;accent-color:#D95700;flex:none;}
  .elig{display:flex;gap:12px;align-items:flex-start;margin-top:8px;cursor:pointer;border:1px solid #C9CBB4;background:#fff;padding:12px 14px;font-size:13px;line-height:1.5;color:#0C3824;}
  .elig input{width:17px;height:17px;margin-top:2px;accent-color:#D95700;flex:none;}
  textarea.field{min-height:84px;resize:vertical;line-height:1.45;}
  .err{margin-top:14px;background:#F8E3D5;border-left:3px solid #D95700;padding:12px 16px;font-size:13.5px;color:#8A3B00;}
  @media (max-width:640px){ .card{padding:30px 22px;} .grid2{grid-template-columns:1fr !important;} }
  @media print { body{background:#fff;} .app{display:none !important;} #printDoc{display:block !important;} }
</style>

<script>
(function(){
  var A = window.BB_AGREEMENT, ACKS = window.BB_ACKS;
  var KEY='bb-wc-v1';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){ return {}; } }
  function save(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} }
  var state = load();
  var step = (state.accepted && state.accepted['agreement-version']===A.version) ? 4 : 1;
  var kind = 'individual';
  var stepsBar = document.getElementById('stepsBar');
  var panel = document.getElementById('panel');
  var SERIF = "font-family:'Cormorant Garamond',serif;font-weight:400;";

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function today(){ return new Date().toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'}); }
  function paras(list, size){ return list.map(function(p){ return '<p style="font-size:'+size+'px;line-height:1.55;color:#42574A;margin:0 0 10px;">'+esc(p)+'</p>'; }).join(''); }
  function blocks(list){ return list.map(function(sec){
    return '<div style="margin-bottom:22px;"><div style="font:600 14px Archivo;letter-spacing:0.06em;text-transform:uppercase;color:#0C3824;margin-bottom:8px;">'+esc(sec.h)+'</div>'+paras(sec.b,13)+'</div>'; }).join(''); }
  function go(n){ step=n; render(); window.scrollTo(0,0); }

  function renderSteps(){
    var defs=[['1','Access Notice'],['2','Notices'],['3','Agreement'],['4','Confirmation']];
    stepsBar.innerHTML = defs.map(function(d,i){
      var active = step===i+1, done = step>i+1;
      var bg = active?'#D95700':(done?'#F5F5EB':'transparent');
      var fg = active?'#F5F5EB':(done?'#0C3824':'rgba(245,245,235,0.7)');
      var lc = active?'#F5F5EB':'rgba(245,245,235,0.55)';
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">'+
        '<div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 14px Archivo;background:'+bg+';color:'+fg+';border:1px solid rgba(245,245,235,0.4);">'+(done?'✓':d[0])+'</div>'+
        '<div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:'+lc+';text-align:center;">'+d[1]+'</div></div>';
    }).join('');
  }

  function render(){
    renderSteps();
    if (step===1) {
      panel.innerHTML = '<div class="card">'+
        '<div style="border-top:2px solid #0C3824;padding-top:14px;"><h1 style="'+SERIF+'font-size:34px;margin:0;color:#0C3824;">Access Notice</h1></div>'+
        '<p style="font-size:15px;line-height:1.6;color:#0C3824;font-weight:600;margin:20px 0 12px;">'+esc(A.accessNotice[0])+'</p>'+
        A.accessNotice.slice(1).map(function(p){ return '<p style="font-size:15px;line-height:1.6;color:#42574A;margin:0 0 12px;">'+esc(p)+'</p>'; }).join('')+
        '<button class="btn orange" id="anGo" style="margin-top:14px;">Continue</button></div>';
      document.getElementById('anGo').onclick=function(){ go(2); };
    }
    if (step===2) {
      panel.innerHTML = '<div class="card">'+
        '<div style="border-top:2px solid #0C3824;padding-top:14px;"><h1 style="'+SERIF+'font-size:34px;margin:0;color:#0C3824;">'+esc(A.noticesTitle)+'</h1></div>'+
        '<div style="margin:20px 0 0;max-height:400px;overflow-y:auto;border:1px solid #C9CBB4;background:#fff;padding:22px 24px;">'+blocks(A.notices)+'</div>'+
        '<label class="check"><input type="checkbox" id="flsCk"><span>I have read and understood the notices above, including the cautionary statement regarding forward-looking statements.</span></label>'+
        '<button class="btn" id="flsGo" disabled style="margin-top:24px;">Accept and Continue</button></div>';
      var ck=document.getElementById('flsCk'), g=document.getElementById('flsGo');
      ck.onchange=function(){ g.disabled=!ck.checked; g.classList.toggle('orange', ck.checked); };
      g.onclick=function(){ state.noticesAt=new Date().toISOString(); go(3); };
    }
    if (step===3) {
      var L = ['a','b','c','d','e'];
      panel.innerHTML = '<div class="card">'+
        '<div style="border-top:2px solid #0C3824;padding-top:14px;">'+
        '<h1 style="'+SERIF+'font-size:30px;line-height:1.15;margin:0;color:#0C3824;">'+esc(A.title)+'</h1>'+
        '<div style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#939A73;margin-top:10px;">Brains Bioceutical Corp.</div></div>'+
        '<p style="font-size:13.5px;line-height:1.5;color:#42574A;margin:14px 0 0;">Review the Agreement below, then complete the acceptance form. No Confidential Information is made available through this site.</p>'+
        '<div style="margin-top:18px;height:420px;overflow-y:auto;border:1px solid #C9CBB4;background:#fff;padding:26px 30px;box-sizing:border-box;">'+blocks(A.sections)+'</div>'+
        '<div style="margin-top:30px;border-top:1px solid #C9CBB4;padding-top:22px;">'+
        '<div style="font:600 13px Archivo;letter-spacing:0.16em;text-transform:uppercase;color:#D95700;">Acceptance (Section 15)</div>'+
        '<div style="display:flex;gap:10px;margin-top:16px;"><button class="kind-btn on" id="kInd" type="button">Accepting as an individual</button><button class="kind-btn" id="kEnt" type="button">Accepting for a corporation / entity</button></div>'+
        '<div class="grid2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;margin-top:22px;">'+
        '<div id="rowEntity" style="grid-column:1 / -1;display:none;"><div class="flabel">Recipient full legal name (entity)</div><input class="field" id="fEntity" placeholder="e.g. ABC Capital Partners Inc."></div>'+
        '<div><div class="flabel" id="nameLabel">Recipient full legal name</div><input class="field" id="fName" placeholder="Full legal name"></div>'+
        '<div id="rowTitle" style="display:none;"><div class="flabel">Title</div><input class="field" id="fTitle" placeholder="e.g. Managing Director"></div>'+
        '<div><div class="flabel">Jurisdiction of residence or organisation</div><input class="field" id="fJur" placeholder="e.g. New York, United States"></div>'+
        '<div style="grid-column:1 / -1;"><div class="flabel">Capacity (Section 1.4)</div>'+
        '<select class="field" id="fCap"><option value="Prospective investor">Prospective investor</option><option value="Adviser to a prospective investor">Adviser to a prospective investor</option></select></div>'+
        '<div id="rowAdv" style="grid-column:1 / -1;display:none;"><div class="flabel">Prospective investor advised</div><input class="field" id="fAdv" placeholder="Full legal name of the prospective investor"></div>'+
        '<div><div class="flabel">Email (for notices, s. 12.7)</div><input class="field" id="fEmail" type="email" placeholder="name@company.com"></div>'+
        '<div style="grid-column:1 / -1;"><div class="flabel">Address (for notices, s. 12.7)</div></div>'+
        '<div style="grid-column:1 / -1;"><input class="field" id="fStreet" placeholder="Street address"></div>'+
        '<div><input class="field" id="fCity" placeholder="City"></div>'+
        '<div><input class="field" id="fRegion" placeholder="Province / State"></div>'+
        '<div><input class="field" id="fPostal" placeholder="Postal / ZIP code"></div>'+
        '<div><input class="field" id="fCountry" placeholder="Country"></div></div>'+
        '<div style="margin-top:24px;"><div class="flabel">Eligibility category (Section 13.1). The Recipient is:</div>'+
        L.map(function(l){ return '<label class="elig"><input type="radio" name="elig" value="'+l+'"><span>('+l+') '+esc(A.eligibility[l])+'</span></label>'; }).join('')+'</div>'+
        '<div style="margin-top:24px;"><div class="flabel">Individuals who are to have access (name and email, one per line)</div><textarea class="field" id="fAccess" placeholder="Jane Smith, jane.smith@company.com"></textarea></div>'+
        '<div style="margin-top:18px;"><div class="flabel">Instrument relied on under Section 6.3(a), if any</div><textarea class="field" id="fInstr" style="min-height:56px;" placeholder="Leave blank if none"></textarea></div>'+
        '<div style="margin-top:26px;"><div class="flabel">Acknowledgements</div>'+
        ACKS.map(function(t,i){ return '<label class="check" style="margin-top:8px;"><input type="checkbox" class="ack" data-i="'+i+'"><span>'+esc(t)+'</span></label>'; }).join('')+'</div>'+
        '<div style="margin-top:24px;"><div class="flabel">Type your full name</div><input class="field" id="fTyped" placeholder="Full name of the individual accepting" autocomplete="off"></div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:16px;flex-wrap:wrap;">'+
        '<div style="font-size:13px;color:#9A9A8C;">Version '+esc(A.version)+' · '+today()+'</div>'+
        '<button class="btn orange" id="signGo" type="button">I accept</button></div>'+
        '<div id="err"></div></div></div>';
      var kInd=document.getElementById('kInd'), kEnt=document.getElementById('kEnt'), cap=document.getElementById('fCap');
      function setKind(k){ kind=k; kInd.classList.toggle('on',k==='individual'); kEnt.classList.toggle('on',k==='entity');
        document.getElementById('rowEntity').style.display = k==='entity'?'block':'none';
        document.getElementById('rowTitle').style.display = k==='entity'?'block':'none';
        document.getElementById('nameLabel').textContent = k==='entity'?'Name of the individual accepting':'Recipient full legal name'; }
      kInd.onclick=function(){setKind('individual');}; kEnt.onclick=function(){setKind('entity');};
      cap.onchange=function(){ document.getElementById('rowAdv').style.display = cap.value.indexOf('Adviser')===0?'block':'none'; };
      document.getElementById('signGo').onclick=function(){
        var isEnt = kind==='entity', isAdv = cap.value.indexOf('Adviser')===0;
        var v = function(id){ return document.getElementById(id).value.trim(); };
        var el = document.querySelector('input[name="elig"]:checked');
        var acks = Array.prototype.slice.call(document.querySelectorAll('.ack'));
        var miss=[];
        if (isEnt && !v('fEntity')) miss.push('entity legal name');
        if (!v('fName')) miss.push('full legal name');
        if (isEnt && !v('fTitle')) miss.push('title');
        if (!v('fJur')) miss.push('jurisdiction');
        if (isAdv && !v('fAdv')) miss.push('prospective investor advised');
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('fEmail'))) miss.push('valid email');
        if (!v('fStreet')) miss.push('street address');
        if (!v('fCity')) miss.push('city');
        if (!v('fRegion')) miss.push('province/state');
        if (!v('fPostal')) miss.push('postal/ZIP code');
        if (!v('fCountry')) miss.push('country');
        if (!el) miss.push('eligibility category');
        if (!v('fAccess')) miss.push('individuals who are to have access');
        if (acks.some(function(c){ return !c.checked; })) miss.push('each acknowledgement');
        if (!v('fTyped')) miss.push('your typed full name');
        else if (v('fTyped').toLowerCase().replace(/\s+/g,' ') !== v('fName').toLowerCase().replace(/\s+/g,' ')) miss.push('a typed name that matches the name of the individual accepting');
        var errEl = document.getElementById('err');
        if (miss.length){ errEl.innerHTML='<div class="err">Please provide: '+esc(miss.join(', '))+'.</div>'; return; }
        errEl.innerHTML='';
        var btn=document.getElementById('signGo'); btn.disabled=true; btn.textContent='Submitting…';
        var rec = { 'recipient-type': isEnt?'Corporation / entity':'Individual',
          'entity': isEnt?v('fEntity'):'', 'name': v('fName'), 'title': isEnt?v('fTitle'):'',
          'capacity': cap.value, 'investor-advised': isAdv?v('fAdv'):'', 'jurisdiction': v('fJur'),
          'eligibility': window.BB_eligibilityLabel(el.value),
          'email': v('fEmail'), 'address': v('fStreet')+', '+v('fCity')+', '+v('fRegion')+' '+v('fPostal')+', '+v('fCountry'),
          'date': today(), 'timestamp': new Date().toISOString(),
          'typed-name': v('fTyped'), 'agreement-version': A.version, 'notices-version': A.noticesVersion,
          'access-individuals': v('fAccess'), 'instrument-6-3a': v('fInstr') || 'None',
          'acknowledgements': ACKS.map(function(t){ return '[x] '+t; }).join('\n') };
        state.accepted = rec; save(state);
        var f = document.forms['nda'];
        Object.keys(rec).forEach(function(k){ if (f.elements[k]) f.elements[k].value = rec[k]; });
        f.submit();
      };
    }
    if (step===4) {
      var r = state.accepted || {};
      panel.innerHTML = '<div class="card" style="text-align:center;padding:52px 28px;">'+
        '<div style="width:56px;height:56px;border-radius:50%;background:#0C3824;color:#F5F5EB;display:inline-flex;align-items:center;justify-content:center;font-size:26px;">✓</div>'+
        '<h1 style="'+SERIF+'font-size:36px;margin:22px 0 0;color:#0C3824;">Agreement Accepted</h1>'+
        '<p style="font-size:15px;line-height:1.6;color:#42574A;margin:14px auto 0;max-width:540px;">Accepted by <strong>'+esc(r['typed-name']||r.name)+'</strong> on '+esc(r.date)+'. The restrictions in the Agreement now apply. No materials are made available through this site. Brains Bioceutical Corp. will contact you directly.</p>'+
        '<div style="display:flex;gap:14px;justify-content:center;margin-top:32px;flex-wrap:wrap;">'+
        '<button class="btn" id="dlNda" style="background:none;border:1px solid #0C3824;color:#0C3824;">Save a Copy (PDF)</button></div></div>';
      document.getElementById('dlNda').onclick=function(){
        document.getElementById('printDoc').innerHTML = window.BB_renderExecuted(r);
        setTimeout(function(){ window.print(); }, 80);
      };
    }
  }
  render();
})();
</script>
</body></html>
